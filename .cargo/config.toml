# Linkers used when cross-compiling inside the Docker builder
# (see Dockerfile). armv7 covers 32-bit Raspbian; aarch64 covers
# 64-bit Raspberry Pi OS. x86_64 (dev/CI) needs no config.
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

